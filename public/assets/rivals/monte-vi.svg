<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="49" fill="#F0CB3C"/>
  <circle cx="50" cy="50" r="44" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="40" fill="#243A82"/>

  <!-- ladera / campo bajo el fuerte -->
  <path d="M22 58 L78 58 L72 84 A28 26 0 0 1 28 84 Z" fill="#F0CB3C"/>

  <!-- olas -->
  <path d="M24 66 Q31 62 38 66 T52 66 T66 66 T76 66" stroke="#243A82" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M25 73 Q32 69 39 73 T53 73 T67 73 T75 73" stroke="#243A82" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M27 80 Q34 76 41 80 T55 80 T69 80 T73 80" stroke="#243A82" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- torres laterales -->
  <rect x="25" y="35" width="9" height="24" fill="#F0CB3C"/>
  <rect x="66" y="35" width="9" height="24" fill="#F0CB3C"/>
  <ellipse cx="29.5" cy="35" rx="4.5" ry="3" fill="#1B1B1B"/>
  <ellipse cx="70.5" cy="35" rx="4.5" ry="3" fill="#1B1B1B"/>

  <!-- muralla con almenas -->
  <g fill="#F0CB3C">
    <rect x="30" y="41" width="40" height="18"/>
    <rect x="30" y="35" width="6" height="6"/>
    <rect x="40" y="35" width="6" height="6"/>
    <rect x="54" y="35" width="6" height="6"/>
    <rect x="64" y="35" width="6" height="6"/>
  </g>

  <!-- lineas de ladrillo -->
  <g stroke="#243A82" stroke-width="0.9" fill="none">
    <line x1="30" y1="47" x2="70" y2="47"/>
    <line x1="30" y1="53" x2="70" y2="53"/>
    <line x1="38" y1="41" x2="38" y2="47"/>
    <line x1="62" y1="41" x2="62" y2="47"/>
    <line x1="34" y1="47" x2="34" y2="53"/>
    <line x1="66" y1="47" x2="66" y2="53"/>
  </g>

  <!-- puerta en arco -->
  <path d="M44 59 L44 47 A6 6 0 0 1 56 47 L56 59 Z" fill="#243A82"/>
  <path d="M46.3 59 L46.3 48.5 A3.7 3.7 0 0 1 53.7 48.5 L53.7 59 Z" fill="#1B1B1B"/>

  <!-- tronera / adorno superior -->
  <path d="M45.5 35 A4.5 5 0 0 1 54.5 35" fill="none" stroke="#1B1B1B" stroke-width="1.6"/>
  <circle cx="50" cy="33" r="1.4" fill="#1B1B1B"/>
